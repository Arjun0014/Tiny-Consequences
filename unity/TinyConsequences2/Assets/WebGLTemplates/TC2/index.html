<!DOCTYPE html>
<html lang="en-us">
  <head>
    <link rel="icon" href="data:,">
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no">
    <title>{{{ PRODUCT_NAME }}}</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #04060c; }
      #tc2-canvas { width: 100%; height: 100%; display: block; background: #04060c; outline: none; }
      #tc2-loading { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 320px; text-align: center;
                     font: italic 15px/1.4 Georgia, 'Times New Roman', serif; color: #cdbf9f; }
      #tc2-title { font: 34px/1.2 Georgia, 'Times New Roman', serif; font-style: normal; color: #f0d48c; letter-spacing: .02em; margin-bottom: 10px; }
      #tc2-bar { margin-top: 12px; height: 3px; background: #2a2418; border-radius: 2px; overflow: hidden; }
      #tc2-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #8a6a30, #f0d48c); }
      #tc2-warning { position: absolute; left: 0; right: 0; top: 0; font: 13px system-ui, sans-serif; color: #000; }
    </style>
  </head>
  <body>
    <canvas id="tc2-canvas" tabindex="-1"></canvas>
    <div id="tc2-loading"><div id="tc2-title">Tiny Consequences</div><div id="tc2-bar"><div id="tc2-fill"></div></div><div id="tc2-note"></div></div>
    <div id="tc2-warning"></div>
    <script>
      // TC2 web template (D2-011): probe for a working WebGPU device before Unity starts. Some browsers expose
      // navigator.gpu but cannot create a device (missing drivers/compilers); Unity only falls back to WebGL2 when
      // WebGPU is absent, so a failed probe hides it. ?gfx=webgl2 forces the fallback (tests, troubleshooting).
      async function tc2ProbeWebGPU() {
        var forced = new URLSearchParams(window.location.search).get('gfx');
        var hide = function (why) {
          console.warn('TC2: using WebGL2 (' + why + ')');
          window.__TC2_GFX = 'webgl2 (' + why + ')';
          try { Object.defineProperty(navigator, 'gpu', { value: undefined, configurable: true }); } catch (e) { }
        };
        if (forced === 'webgl2') { hide('forced'); return; }
        if (!navigator.gpu) { window.__TC2_GFX = 'webgl2 (no navigator.gpu)'; return; }
        try {
          var adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
          if (!adapter) { hide('no adapter'); return; }
          var device = await adapter.requestDevice();
          if (!device) { hide('no device'); return; }
          var lost = false;
          device.lost.then(function () { lost = true; });
          await new Promise(function (r) { setTimeout(r, 30); });
          if (lost) { hide('device lost'); return; }
          if (device.destroy) device.destroy();
          window.__TC2_GFX = 'webgpu';
        } catch (e) { hide(String(e)); }
      }

      function tc2Banner(msg, type) {
        var w = document.querySelector('#tc2-warning');
        var div = document.createElement('div');
        div.textContent = msg;
        div.style = 'padding: 8px; background: ' + (type == 'error' ? '#e66' : '#ec6');
        w.appendChild(div);
        if (type != 'error') setTimeout(function () { w.removeChild(div); }, 6000);
      }

      var buildUrl = "Build";
      var config = {
        arguments: [],
#if PROGRESSIVE_ASSET_LOADING
        primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
        secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
        dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
#endif
        frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
        codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
        symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
        showBanner: tc2Banner,
      };

      tc2ProbeWebGPU().then(function () {
        document.querySelector('#tc2-note').textContent = 'A small world is waking...';
        var script = document.createElement('script');
        script.src = buildUrl + "/{{{ LOADER_FILENAME }}}";
        script.onload = function () {
          var fill = document.querySelector('#tc2-fill');
          createUnityInstance(document.querySelector('#tc2-canvas'), config, function (progress) {
            fill.style.width = (100 * progress) + '%';
          }).then(function (unityInstance) {
            window.__TC2_INSTANCE = unityInstance;
            document.querySelector('#tc2-loading').style.display = 'none';
          }).catch(function (message) {
            window.__TC2_FATAL = String(message);
            tc2Banner(String(message), 'error');
          });
        };
        document.body.appendChild(script);
      });
    </script>
  </body>
</html>
